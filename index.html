goc.addEventListener("keydown", function(event) {

            rotatecannon();

function rotatecannon() {
    mM.style.display = "none";
    goc.style.display = "none";
    cannon.style.transform = `rotate(${-a}deg)`;
    setTimeout(fire, 1000);
}
function fire() {
    cannon.style.display = "none";
    bullet.style.display = "block";
    bullet.style.left = "0%";
    let t = (2*b)*Math.sin(a*Math.PI/180)/9.81;
    let x = 0;
    let l = b**2*Math.sin(2*a*Math.PI/180)/9.81;
    let l1 = (l/(70**2*Math.sin(2*45*Math.PI/180)/9.81))*98;
    let vy0 = b*Math.sin(a*Math.PI/180);
    let h1 = 0.7207;
    let h = 0;
    let v = 0;
    let c = 0.01;
    let H = (vy0**2)/(2*9.81);
    let fall = false;
    let interval = setInterval(function() {
        x += (l1/t)*0.01;
        bullet.style.left = x + "%";
        if (fall == false) {
            v = vy0-9.81*c;
            h = vy0*c-0.5*9.81*(c**2);
            c +=0.01
            if (v<=0) {
                fall = true;
                c=0.01;
            }
        }
        else {
            v = 9.81*c;
            h = H-0.5*9.81*(c**2)
            c += 0.01;
        }
        bullet.style.bottom = (5 + Math.max(0, h*h1)) + "%";
        if (x >= l1) {
            clearInterval(interval);
            mM.style.display = "block";
            popup.style.display = "block";
            popup.innerHTML = `<h2>Distance from the cannon: ${l} m</h2><h2>Max height: ${H} m</h2><h2>Time of flight: ${t} s</h2>`;
        }
    }, 10);
}

let d = 0;
let bc = 1;
let khoiluong = 0;
let thetich = 0;
let fl = "false";
let sk = "false";
const fn = document.getElementById("floatbutton");
const sn = document.getElementById("sinkbutton");
const keep = document.getElementById("keep");
const cb = document.getElementById("controlboard");
const choose = document.getElementById("choose");

const mass = document.getElementById("mass");
const nc = document.getElementById("nuoc");

const du = document.getElementById("dau");
function nuoc() {
    d = 10000;
    nc.style.display = "none";
    ty.style.display = "none";
    du.style.display = "none";
    choose.innerHTML = "Type in..."
    calculate();
}

    d = 136000;
    nc.style.display = "none";
    ty.style.display = "none";
    du.style.display = "none";
    choose.innerHTML = "Type in..."
    calculate();
}
function dau() {
    d = 800;
    nc.style.display = "none";
    ty.style.display = "none";
    du.style.display = "none";
    choose.innerHTML = "Type in..."
    calculate();
}
function calculate() {
    mass.style.display = "block";
}
mass.addEventListener("keydown", function(event) {
        if (event.key === "Enter" && bc == 1) {
            khoiluong = mass.value;
            mass.value = "";
            mass.placeholder = "Enter the volume of the object max:10m^3";
            bc = 2;
        }
        else if (event.key === "Enter" && mass.value <=10 && bc == 2) {
            thetich = mass.value;
            mass.value = "";
            mass.style.display = "none";
            mass.placeholder = "Enter the mass of the object(ton)";
            run();
        }
        else if (event.key === "Enter" && mass.value > 10 && bc == 2) {
            alert("The volume of the object must be less than or equal to 10m^3");
        }
    }
);

function run() {
    let x = (khoiluong/thetich)*10-d;
    cb.style.display = "block";
    keep.innerHTML = "Do you want to automatically<br>change your object state in the liquid?";
    if (x > 0) {
        setState("sink");
    }
    else if (x == 0) {
        setState("neutral");
    }
    else {
        setState("float");
    }
}
function setState(state) {
    if (state == "float") {
        vat.style.display = "block";
        vat.style.bottom = "50%";
        choose.innerHTML = "Your object floats!";
        fn.innerHTML = "Neutrally buoyant";
        sn.innerHTML = "Sink";
        fn.setAttribute("onclick", "otherstate('neutral')");
        sn.setAttribute("onclick", "otherstate('sink')");
    }
    else if (state == "sink") {
        vat.style.display = "block";
        vat.style.bottom = "15%";
        choose.innerHTML = "Your object sinks!";
        fn.innerHTML = "Float";
        sn.innerHTML = "Neutrally buoyant";
        fn.setAttribute("onclick", "otherstate('float')");
        sn.setAttribute("onclick", "otherstate('neutral')");
    }
    else if (state == "neutral") {
        vat.style.display = "block";
        vat.style.bottom = "30%";
        choose.innerHTML = "Your object is neutrally buoyant!";
        fn.innerHTML = "Float";
        sn.innerHTML = "Sink";
        fn.setAttribute("onclick", "otherstate('float')");
        sn.setAttribute("onclick", "otherstate('sink')");
    }
}
function otherstate(state) {
    let z = prompt("Type 1 to keep the mass, 2 to keep the volume");
    if (z !== "1" && z !== "2") {
        alert("Please type 1 or 2.");
        return;
    }
    let condition = "";
    if (z == "1") {
        let V = (10000*khoiluong)/d;
        if (state == "float") {
            condition = "Your object's volume must be greater than: " + V + "m³";
        }
        else if (state == "sink") {
            condition = "Your object's volume must be smaller than: " + V + "m³";
        }
        else {
            condition = "Your object's volume must be: " + V + "m³";
        }
    }
    else {
        let M = d*thetich/10000;
        if (state == "float") {
            condition = "Your object's mass must be smaller than: " + M + "ton";
        }
        else if (state == "sink") {
            condition = "Your object's mass must be greater than: " + M + "ton";
        }
        else {
            condition = "Your object's mass must be: " + M + "ton";
        }
    }
    setState(state);
    choose.innerHTML = condition;
}

const idealgas1 = document.getElementById("idealgas1");
const idealgas2 = document.getElementById("idealgas2");
let apsuat = 0;
let thetichkhi = 0;
let nhietdo = 0;
let chooseidealgasstate = 1;
const hinhvuong = document.getElementById("hinhvuong");
const pressuretext = document.getElementById("pressuretext");
const volumetext = document.getElementById("volumetext");
const temperaturetext = document.getElementById("temperaturetext");
const nhan1 = document.getElementById("nhan1");
const nhan2 = document.getElementById("nhan2");
function calculateidealgas() {
    if (chooseidealgasstate == 1) {
        idealgas1.setAttribute("max", "10");
        idealgas1.setAttribute("min", "1");
        idealgas1.setAttribute("step", "1"); 
        apsuat = idealgas1.value/10
        thetichkhi = idealgas2.value;
        nhietdo = (apsuat*100000*thetichkhi)/8.31;
        pressuretext.innerHTML = "Pressure: " + apsuat + "MPa";
        volumetext.innerHTML = "Volume: " + thetichkhi + "m^3";
        temperaturetext.innerHTML = "Temperature: " + nhietdo + "K";
        hinhvuong.style.width = 10+(thetichkhi/2)+"%";
        hinhvuong.style.top = 30-(thetichkhi/2)+"%";
        hinhvuong.style.left = 45-(thetichkhi/4)+"%";
        
    }
    else if (chooseidealgasstate == 2) {
        idealgas1.setAttribute("max", "100");
        idealgas1.setAttribute("min", "0");
        idealgas1.setAttribute("step", "10");  
        if (idealgas1.value == 0) {
            nhietdo = idealgas1.value;
            pressuretext.innerHTML = "Pressure: " + "Can't calculate";
            volumetext.innerHTML = "Volume: " + "Can't calculate";
            temperaturetext.innerHTML = "Temperature: " + nhietdo + "K";            
        }
        else {
            nhietdo = idealgas1.value
            thetichkhi = idealgas2.value;
            apsuat = (8.31*nhietdo)/thetichkhi;
            pressuretext.innerHTML = "Pressure: " + apsuat + "Pa";
            volumetext.innerHTML = "Volume: " + thetichkhi + "m^3";
            temperaturetext.innerHTML = "Temperature: " + nhietdo + "K";
            hinhvuong.style.width = 10+(thetichkhi/2)+"%";
            hinhvuong.style.top = 30-(thetichkhi/2)+"%";
            hinhvuong.style.left = 45-(thetichkhi/4)+"%";
        }     
    }
    else {
        idealgas1.setAttribute("max", "100");
        idealgas1.setAttribute("min", "0");
        idealgas1.setAttribute("step", "10");  
        if (idealgas1.value == 0) {
            nhietdo = idealgas1.value;
            pressuretext.innerHTML = "Pressure: " + "Can't calculate";
            volumetext.innerHTML = "Volume: " + "Can't calculate";
            temperaturetext.innerHTML = "Temperature: " + nhietdo + "K";
        }
        else {
            nhietdo = idealgas1.value
            apsuat = idealgas2.value;
            thetichkhi = (8.31*nhietdo)/apsuat;
            pressuretext.innerHTML = "Pressure: " + apsuat + "Pa";
            volumetext.innerHTML = "Volume: " + thetichkhi + "m^3";
            temperaturetext.innerHTML = "Temperature: " + nhietdo + "K";
            hinhvuong.style.width = 10+(thetichkhi/2)+"%";
            hinhvuong.style.top = 30-(thetichkhi/2)+"%";
            hinhvuong.style.left = 45-(thetichkhi/4)+"%";            
        }       
    }
}

const loxo = document.getElementById("loxo");
const vatdd = document.getElementById("vatdaodong");
const chinhphabandau = document.getElementById("chinhphabandau");
const oscillationdata = document.getElementById("oscillationdata");
const startoscillation = document.getElementById("startoscillation");
const nhanpha = document.getElementById("nhanpha");
const lido = document.getElementById("lido");
const vantoctucthoi = document.getElementById("vantoctucthoi");
const giatoctucthoi = document.getElementById("giatoctucthoi");
let omega = 0;
let phabandau = 0;
let stop = false;
let thoigiandaodong = 0;
let runoscillation;
let A = 0;
function chinhpha() {
    vatdd.style.left = chinhphabandau.value + "%";
    loxo.style.width = chinhphabandau.value + "%";
    nhanpha.innerHTML = "<strong>A = " + Math.abs(chinhphabandau.value-47) + "cm</strong>";
    nhanpha.style.left = "47%";
}
oscillationdata.addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
        if (event.key === "Enter" && oscillationdata.value > 0) {
            omega = oscillationdata.value;
            oscillationdata.value = "";
            oscillationdata.style.display = "none";
        }
        else if (event.key === "Enter" && oscillationdata.value <= 0) {
            alert("Your object's angular speed must be greater than 0");
        }
    }
});
function startos() {
    if (omega == 0) {
        alert("Please enter your object's angular speed");
        return;
    }
    chinhphabandau.style.display = "none";
    nhanpha.style.display = "none";
    startoscillation.setAttribute("onclick", "stopos()");
    startoscillation.innerHTML = "Stop!";
    A = Math.abs(47-chinhphabandau.value);
    if (chinhphabandau.value > 47) {
        phabandau = 0;
    }
    else if (chinhphabandau.value < 47) {
        phabandau = Math.PI;
    }
    else {
        alert("Please choose a starting point different from 47%.");
        return;
    }
        runoscillation = setInterval(function() {
            vatdd.style.left = 47+A*Math.cos(omega*thoigiandaodong+phabandau) + "%";
            loxo.style.width = 47+A*Math.cos(omega*thoigiandaodong+phabandau) + "%";
            lido.innerHTML = "Displacement: " + A*Math.cos(omega*thoigiandaodong+phabandau) + "cm";
            vantoctucthoi.innerHTML = "Velocity: " + (-omega*A*Math.sin(omega*thoigiandaodong+phabandau)) + "cm/s";
            giatoctucthoi.innerHTML = "Acceleration: " + (-(omega**2)*A*Math.cos(omega*thoigiandaodong+phabandau)) + "cm/s<sup>2</sup>";
            thoigiandaodong += 0.001;
    }, 1);
}
function stopos() {
    clearInterval(runoscillation);
    startoscillation.setAttribute("onclick", "startos()");
    startoscillation.innerHTML = "Start!";
}

let buocsong = 30;
let biendosong = 30;
let tansosong = 1;
let intervalsong = [];
let landau = false;
const nhanbiendosong = document.getElementById("nhanbiendosong");
const nhanbuocsong = document.getElementById("nhanbuocsong");
const nhantansosong = document.getElementById("nhantansosong");
const chinhbiendosong = document.getElementById("chinhbiendosong");
const chinhbuocsong = document.getElementById("chinhbuocsong");
const chinhtansosong = document.getElementById("chinhtansosong");
function songdaodong() {
    for (let j=0; j<=100; j++) {
        let pts = document.getElementById("phantusong"+j);
        phantusongdaodong(pts, j);
    }
}
function phantusongdaodong(pts, j) {
    let thoigiansong = 0;
    let moiphantudaodong = setInterval(function() {
        pts.style.top = 30 + biendosong*Math.cos(2*Math.PI*tansosong*thoigiansong+Math.PI/2 - (2*Math.PI*j)/buocsong) + "%";
        thoigiansong += 0.01;
    }, 10);
    intervalsong.push(moiphantudaodong);
}
function chinhsong() {
    buocsong = chinhbuocsong.value;
    biendosong = chinhbiendosong.value;
    tansosong = chinhtansosong.value;
    nhanbiendosong.innerHTML = "<strong>Wave's amplitude: " + biendosong + "cm</strong>";
    nhanbuocsong.innerHTML = "<strong>Wavelength: " + buocsong + "cm</strong>";
    nhantansosong.innerHTML = "<strong>Wave's frequency: " + tansosong + "Hz</strong>";
    nhanbuocsong.style.left = "10%";
    nhanbiendosong.style.left = "42%";
    nhantansosong.style.right = "7%";
}
